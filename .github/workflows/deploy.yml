name: Project Deployment

on:
  push:
    branches: [main]
    paths:
      - "Project/app/**"
      - "Project/Terraform/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: Project/app
  TF_DIR: Project/Terraform
  IMAGE_NAME: fastapi-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Authenticate to Azure using a service principal client secret.
      # Repo secret required: AZURE_CREDENTIALS (JSON with clientId/clientSecret/subscriptionId/tenantId)
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Terraform authenticates to Azure with the service principal client secret.
      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform init -input=false

      # Phase 1: create only the registry (and its RG) so we have somewhere
      # to push the image before the Container App (which needs that image) exists.
      - name: Terraform Apply (registry)
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform apply -auto-approve -input=false \
            -target=azurerm_resource_group.rg \
            -target=azurerm_container_registry.acr

      - name: Read ACR login server
        id: tf
        working-directory: ${{ env.TF_DIR }}
        run: echo "acr_login_server=$(terraform output -raw acr_login_server)" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR
        run: az acr login --name "${{ steps.tf.outputs.acr_login_server }}"

      - name: Build and push image
        working-directory: ${{ env.APP_DIR }}
        env:
          ACR: ${{ steps.tf.outputs.acr_login_server }}
        run: |
          docker build \
            -t "$ACR/$IMAGE_NAME:${{ github.sha }}" \
            -t "$ACR/$IMAGE_NAME:latest" .
          docker push "$ACR/$IMAGE_NAME:${{ github.sha }}"
          docker push "$ACR/$IMAGE_NAME:latest"

      # Phase 2: apply the full stack now that the image exists, deploying the
      # freshly pushed commit-tagged image to the Container App.
      - name: Terraform Apply (full)
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform apply -auto-approve -input=false -var "image_tag=${{ github.sha }}"

      - name: Read app URL
        id: app
        working-directory: ${{ env.TF_DIR }}
        run: echo "url=$(terraform output -raw container_app_url)" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        run: |
          echo "**Image:** ${{ steps.tf.outputs.acr_login_server }}/$IMAGE_NAME:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**App URL:** ${{ steps.app.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
